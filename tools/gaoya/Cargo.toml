[package]
name = "revserp-gaoya"
version = "0.1.0"
edition = "2021"
description = "Revserp near-duplicate text matcher: JSONL {id,text} in, LSH pairs.jsonl out (gaoya MinHash)"
license = "MIT"
homepage = "https://github.com/PS-Wizard/Revserp"
repository = "https://github.com/PS-Wizard/Revserp"

[dependencies]
gaoya = "=0.2.2"
serde_json = "1.0"
fnv = "1.0"

[profile.release]
opt-level = 3
